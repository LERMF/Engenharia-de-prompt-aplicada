# AnduinOS Intel i3-7020U Specific Configuration
# Based on CPU-Z Report Analysis - Hardware Profiling

# =============================================================================
# HARDWARE PROFILE DETECTED
# =============================================================================
# CPU: Intel Core i3-7020U @ 2.30GHz (Kaby Lake-R, 14nm)
# GPU: Intel HD Graphics 620 (Gen 9.5)
# RAM: 4GB DDR4-2400 Single Channel (Samsung)
# Storage: 128GB NVMe SSD + 1TB HDD
# TDP: 15W (Ultra Low Power)
# =============================================================================

[SYSTEM_PROFILE]
hardware_class=ultrabook_low_power
cpu_model=i3-7020U
gpu_model=hd620
ram_gb=4
ram_channels=1
storage_primary=nvme_ssd
power_profile=battery_optimized

# =============================================================================
# KERNEL OPTIMIZATIONS
# =============================================================================
[KERNEL_PARAMS]
# Intel Graphics optimizations for HD 620
i915.enable_fbc=1
i915.enable_psr=1
i915.fastboot=1
i915.enable_dc=2
i915.disable_power_well=0

# Power management for 15W TDP
intel_pstate=passive
processor.max_cstate=2

# Memory management for 4GB system
transparent_hugepage=madvise
vm.swappiness=5
vm.vfs_cache_pressure=50

# =============================================================================
# FIREFOX OPTIMIZATIONS (Arkenfox Enhanced)
# =============================================================================
[FIREFOX_CONFIG]
# Memory constraints for 4GB system
browser.cache.memory.capacity=32768
browser.sessionhistory.max_entries=8
browser.tabs.remote.autostart=false
dom.ipc.processCount=2
browser.tabs.remote.autostart.2=false

# Intel HD 620 Hardware Acceleration
media.ffmpeg.vaapi.enabled=true
media.ffvpx.enabled=false
media.navigator.mediadatadecoder_vpx_enabled=true
gfx.webrender.all=true
layers.acceleration.force-enabled=true
gfx.canvas.accelerated=true
media.av1.enabled=false

# Battery life optimizations
browser.sessionstore.interval=120000
browser.cache.disk.smart_size.enabled=false
browser.cache.disk.capacity=51200
network.http.max-connections=24
network.http.max-connections-per-server=4

# =============================================================================
# OPENBOX CONFIGURATION
# =============================================================================
[OPENBOX_CONFIG]
theme=Clearlooks-Olive
focus_policy=click
window_placement=Smart
dock_layer=Below

# Autostart applications (minimal for 4GB RAM)
autostart_apps=tint2,pcmanfm

[TINT2_CONFIG]
panel_size=28
panel_position=bottom
battery_plugin=enabled
clock_plugin=enabled
systray_plugin=enabled

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================
[ZRAM_CONFIG]
# Crucial for 4GB system
zram_enabled=true
zram_algorithm=lz4
zram_size_percent=25
zram_priority=10

[SYSTEM_SWAPPINESS]
vm.swappiness=5
vm.dirty_background_ratio=5
vm.dirty_ratio=10

# =============================================================================
# INTEL GRAPHICS VA-API SETUP
# =============================================================================
[VAAPI_CONFIG]
# Required packages for Intel HD 620
required_packages=intel-media-driver,vainfo,mesa-va-drivers,libva2,libva-drm2

# Environment variables
LIBVA_DRIVER_NAME=iHD
MOZ_ENABLE_WAYLAND=1
MOZ_DISABLE_RDD_SANDBOX=1

# =============================================================================
# THERMAL MANAGEMENT
# =============================================================================
[THERMAL_CONFIG]
# CPU thermal thresholds for i3-7020U
cpu_temp_warning=70
cpu_temp_critical=85
fan_curve=quiet

# Power profiles
ac_power_profile=balanced
battery_profile=powersave

# =============================================================================
# STORAGE OPTIMIZATIONS
# =============================================================================
[SSD_CONFIG]
# NVMe SSD optimizations
scheduler=none
trim_enabled=true
trim_frequency=weekly

# Mount options for SSD
mount_options=noatime,discard

[HDD_CONFIG]
# 5400 RPM HDD optimizations
scheduler=mq-deadline
readahead_kb=4096

# =============================================================================
# NETWORK OPTIMIZATIONS
# =============================================================================
[NETWORK_CONFIG]
# Low power network settings
wifi_power_save=enabled
tcp_congestion_control=bbr

# =============================================================================
# SERVICES OPTIMIZATION
# =============================================================================
[SERVICES_CONFIG]
# Disable unnecessary services for performance
disabled_services=bluetooth,cups,avahi-daemon
essential_services=NetworkManager,systemd-timesyncd,dbus

# =============================================================================
# LIVE-BUILD CONFIGURATION
# =============================================================================
[LIVE_BUILD_CONFIG]
distribution=bookworm
architecture=amd64
bootloader=grub-efi
iso_size_target=800MB

# Package lists
essential_packages=openbox,tint2,pcmanfm,firefox-esr,intel-media-driver
optional_packages=vainfo,htop,neofetch,pulseaudio
excluded_packages=libreoffice*,thunderbird,games-*

# =============================================================================
# PRESEED AUTOMATION
# =============================================================================
[PRESEED_CONFIG]
# Automatic installation for AnduinOS
partitioning=guided_entire_disk_lvm
filesystem=ext4
timezone=America/Sao_Paulo
locale=pt_BR.UTF-8
keyboard=br

# User setup
default_user=anduinos
auto_login=true

# =============================================================================
# VALIDATION TESTS
# =============================================================================
[VALIDATION_CONFIG]
# Performance targets for i3-7020U + 4GB
boot_time_target=25s
memory_usage_idle_target=800MB
firefox_startup_target=3s
youtube_1080p_cpu_target=25%

# Hardware feature tests
test_vaapi=vainfo
test_graphics=glxinfo
test_audio=pactl info
test_network=iwconfig

# =============================================================================
# BUILD SCRIPT PARAMETERS
# =============================================================================
[BUILD_CONFIG]
build_system=live-build
config_dir=anduinos-i3-7020u
hooks_dir=config/hooks/normal
includes_dir=config/includes.chroot

# Optimization hooks
pre_build_hook=update_intel_driver
post_build_hook=validate_vaapi,optimize_firefox
cleanup_hook=remove_debug_packages

# =============================================================================
# EMERGENCY FALLBACKS
# =============================================================================
[FALLBACK_CONFIG]
# If VA-API fails
fallback_video_driver=mesa
software_rendering=true

# If memory issues occur
emergency_swap=enabled
oom_killer_tuning=conservative

# Performance monitoring
enable_monitoring=true
log_performance=true