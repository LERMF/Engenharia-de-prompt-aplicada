name: Build and Publish ISO-SWARM

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
          
      - name: Build Rust daemon
        run: |
          cd src/daemon
          cargo build --release --target x86_64-unknown-linux-gnu
          strip target/x86_64-unknown-linux-gnu/release/swarm-daemon
          ls -la target/x86_64-unknown-linux-gnu/release/swarm-daemon
          
      - name: Verify binary size
        run: |
          BINARY_SIZE=$(stat -c%s src/daemon/target/x86_64-unknown-linux-gnu/release/swarm-daemon)
          echo "Binary size: $BINARY_SIZE bytes"
          if [ $BINARY_SIZE -gt 5242880 ]; then
            echo "❌ Binary size exceeds 5MB limit"
            exit 1
          fi
          echo "✅ Binary size within 5MB limit"
          
      - name: Install npm dependencies
        run: npm ci
        
      - name: Lint and Test
        run: |
          npm run lint
          npm test
        
      - name: Compile TypeScript
        run: npm run compile
        
      - name: Download sample models
        run: |
          mkdir -p models
          # Download 5 sample GGUF models for testing
          wget -O models/coder_01.gguf "https://huggingface.co/microsoft/Phi-3-mini-4k-instruct-gguf/resolve/main/Phi-3-mini-4k-instruct-q4_0.gguf"
          echo "Sample models downloaded for testing"
          
      - name: Package extension
        run: npm run package
        
      - name: Test extension package
        run: |
          ls -la *.vsix
          unzip -l *.vsix | head -20
          
      - name: Publish to Open-VSX
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-swarm-extension
          path: |
            *.vsix
            src/daemon/target/x86_64-unknown-linux-gnu/release/swarm-daemon
            
  build-iso:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Kali ISO
        run: |
          docker build -t iso-swarm-builder -f tools/Dockerfile .
          docker run --privileged -v $(pwd)/output:/output iso-swarm-builder
          
      - name: Verify ISO size
        run: |
          ISO_SIZE=$(stat -c%s output/*.iso)
          ISO_SIZE_GB=$((ISO_SIZE / 1024 / 1024 / 1024))
          echo "ISO size: ${ISO_SIZE_GB}GB"
          if [ $ISO_SIZE_GB -gt 10 ]; then
            echo "❌ ISO size exceeds 10GB limit"
            exit 1
          fi
          echo "✅ ISO size within 10GB limit"
          
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kali-iso-swarm
          path: output/*.iso