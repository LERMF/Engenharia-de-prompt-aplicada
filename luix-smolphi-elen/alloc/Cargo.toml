[package]
name = "genius-alloc"
version = "0.1.0"
edition = "2021"
authors = ["LUIX-SMOLPHI-ELEN Team"]
description = "RLHF-tuned memory allocator for AI workloads"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
